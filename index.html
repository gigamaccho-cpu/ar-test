<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR テスト</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1d22; font-family: system-ui, sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    #ar-button {
      position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%);
      padding: 14px 28px; border: 0; border-radius: 28px;
      background: #fff; color: #111; font-size: 17px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
    }
    #note {
      position: absolute; left: 0; right: 0; bottom: 36px; text-align: center;
      color: #aab; font-size: 13px; pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- ios-src を省略: iPhone では AR ボタンを押した時点で USDZ を自動生成する -->
  <model-viewer
    src="wyvern.glb"
    alt="3Dモデル"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    shadow-intensity="1"
    exposure="1">
    <button slot="ar-button" id="ar-button">ARで床に置く</button>
  </model-viewer>
  <div id="note" hidden>この端末・ブラウザはARに対応していません（3D表示のみ）</div>
  <script>
    const mv = document.querySelector('model-viewer');
    mv.addEventListener('load', () => {
      // AR非対応環境（PCなど）ではボタンが出ないので、その旨を表示する
      if (!mv.canActivateAR) document.getElementById('note').hidden = false;
    });
  </script>
</body>
</html>
