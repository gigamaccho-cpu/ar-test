<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1016">
  <title>AR Wyvern</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { --fg: #f2f4f8; --dim: #9aa3b5; --accent: #ffd166; --glass: rgba(22, 26, 36, .72); --line: rgba(255, 255, 255, .12); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; color: var(--fg);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: radial-gradient(120% 80% at 50% 35%, #2a3142 0%, #141821 55%, #0a0c11 100%); }
    model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; --poster-color: transparent; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

    header { position: absolute; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 16px) 20px 0;
      display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .28em; }
    #size-label { margin-top: 6px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #size-label small { font-size: 13px; font-weight: 500; color: var(--dim); margin-left: 6px; }
    .tools { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
    .icon { width: 44px; height: 44px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: grid; place-items: center; }
    .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
    .icon:active, .seg button:active, #ar:active { transform: scale(.95); }

    #panel { position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px);
      max-width: 460px; margin: 0 auto; padding: 14px; border-radius: 22px; background: var(--glass);
      border: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(0, 0, 0, .35); }
    .seg button { padding: 9px 0 8px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--dim); line-height: 1.25; }
    .seg button span { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
    .seg button[aria-pressed="true"] { background: #fff; color: #111; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    #roar { flex: 0 0 auto; padding: 0 18px; height: 52px; border-radius: 16px; border: 1px solid var(--line); font-weight: 600; }
    #roar.playing { color: var(--accent); border-color: var(--accent); }
    #ar { flex: 1; height: 52px; border-radius: 16px; background: var(--accent); color: #1a1400; font-size: 17px; font-weight: 700; }
    #ar[disabled] { background: rgba(255, 255, 255, .1); color: var(--dim); font-size: 13px; font-weight: 500; }
    #hint { margin: 10px 2px 0; font-size: 12px; color: var(--dim); text-align: center; min-height: 1.4em; }

    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
      background: #0d1016; transition: opacity .5s; font-size: 13px; letter-spacing: .2em; color: var(--dim); }
    #loading.done { opacity: 0; pointer-events: none; }
    #bar { width: 180px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    #toast { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 12px;
      background: rgba(0, 0, 0, .75); font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <!-- iPhone の AR は ios-src の USDZ（動き・咆哮音入り、大きさ別に3種）を使う。
       URL に ?auto を付けると USDZ を使わず自動生成に戻す（動き・音なし。USDZ が開けないときの切り分け用） -->
  <model-viewer id="mv" src="wyvern.glb" ios-src="wyvern_m.usdz" alt="飛竜の3Dモデル" autoplay
    ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
    camera-controls touch-action="none" auto-rotate rotation-per-second="20deg"
    interaction-prompt="none" shadow-intensity="1.1" shadow-softness="0.9"
    exposure="1.05" tone-mapping="neutral" camera-orbit="30deg 78deg auto">
    <span slot="ar-button"></span>
    <span slot="progress-bar"></span>
  </model-viewer>

  <header>
    <div>
      <h1>AR WYVERN</h1>
      <div id="size-label">1.9<small>m 全長</small></div>
    </div>
    <div class="tools">
      <button class="icon" id="rotate" aria-pressed="true" aria-label="自動回転">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="icon" id="share" aria-label="共有">
        <svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      </button>
    </div>
  </header>

  <div id="panel">
    <div class="seg" id="sizes">
      <button data-len="0.3" data-key="s">卓上<span>30 cm</span></button>
      <button data-len="1.9" data-key="m" aria-pressed="true">中型<span>1.9 m</span></button>
      <button data-len="8" data-key="l" data-fixed>実物大<span>8 m</span></button>
    </div>
    <div class="row">
      <button id="roar">咆哮</button>
      <button id="ar" disabled>読み込み中…</button>
    </div>
    <p id="hint"></p>
  </div>

  <div id="loading"><div>LOADING</div><div id="bar"><i></i></div></div>
  <div id="toast"></div>

  <script>
    const ROAR_T0 = 3.0;       // アニメーション内で咆哮が始まる秒（rig_animate.py と合わせる）
    const USE_USDZ = !new URLSearchParams(location.search).has('auto');
    const BASE_LENGTH = 1.9;   // wyvern.glb の全長（m）。モデルを差し替えたら更新する
    const mv = document.getElementById('mv');
    if (!USE_USDZ) mv.removeAttribute('ios-src');
    const $ = id => document.getElementById(id);
    const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1800); };

    // ---- 読み込み ----
    mv.addEventListener('progress', e => { $('bar').firstElementChild.style.width = (e.detail.totalProgress * 100) + '%'; });
    mv.addEventListener('load', () => {
      $('loading').classList.add('done');
      const ar = $('ar');
      if (mv.canActivateAR) { ar.disabled = false; ar.textContent = 'ARで床に置く'; }
      else { ar.textContent = 'この端末はAR非対応（3D表示のみ）'; }
    });
    mv.addEventListener('error', () => { $('loading').firstElementChild.textContent = '読み込みに失敗しました'; });

    // ---- 大きさ切り替え ----
    const hints = { '0.3': '机の上に置けるサイズ。ピンチで拡大縮小できます',
                    '1.9': '室内向けのサイズ。ピンチで拡大縮小できます',
                    '8': '実寸固定。屋外など広い場所で、少し離れて置いてください' };
    let arScale = 1;
    function setSize(btn) {
      const len = parseFloat(btn.dataset.len), s = len / BASE_LENGTH;
      for (const b of $('sizes').children) b.setAttribute('aria-pressed', b === btn);
      arScale = s;   // 画面上の3D表示は常に同じ大きさ。倍率はAR起動時だけ適用する
      mv.setAttribute('ar-scale', 'fixed' in btn.dataset ? 'fixed' : 'auto');
      if (USE_USDZ) mv.setAttribute('ios-src', `wyvern_${btn.dataset.key}.usdz`);
      $('size-label').firstChild.textContent = len < 1 ? Math.round(len * 100) : len.toFixed(1);
      $('size-label').lastElementChild.textContent = (len < 1 ? 'cm' : 'm') + ' 全長';
      $('hint').textContent = hints[btn.dataset.len] || '';
    }
    $('sizes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSize(b); });
    $('hint').textContent = hints['1.9'];

    // ---- AR ----
    // iPhone は大きさ別の USDZ を使うので倍率は不要。それ以外（Android / ?auto）は起動直前にモデルを拡縮する
    const usesUsdz = () => USE_USDZ && /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document;
    const resetScale = () => { if (mv.scale.x !== 1) mv.scale = '1 1 1'; };
    $('ar').addEventListener('click', async () => {
      toast('ARを準備中…');
      if (!usesUsdz() && arScale !== 1) { mv.scale = `${arScale} ${arScale} ${arScale}`; await mv.updateComplete; }
      mv.activateAR();
    });
    mv.addEventListener('ar-status', e => { if (e.detail.status === 'not-presenting' || e.detail.status === 'failed') resetScale(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(resetScale, 300); });

    // ---- 自動回転 / 共有 ----
    $('rotate').addEventListener('click', e => {
      const on = !mv.autoRotate; mv.autoRotate = on; e.currentTarget.setAttribute('aria-pressed', on);
    });
    $('share').addEventListener('click', async () => {
      const url = location.href;
      try {
        if (navigator.share) await navigator.share({ title: document.title, url });
        else { await navigator.clipboard.writeText(url); toast('URLをコピーしました'); }
      } catch (_) { /* 共有シートを閉じただけ */ }
    });

    // ---- 咆哮（Web Audio でその場で合成。音声ファイルなし）----
    // 高く長い金切り声：不協和な高音2声 + 細かい震え + 高域ノイズ。低音は出だしだけ。
    let ctx;
    function roar() {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      ctx.resume();
      mv.currentTime = ROAR_T0; mv.play();   // 動きを咆哮の頭に合わせる
      const t = ctx.currentTime, d = 3.6;
      const out = ctx.createGain();
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(0.7, t + 0.05);
      out.gain.setValueAtTime(0.7, t + d * 0.72);
      out.gain.exponentialRampToValueAtTime(0.0001, t + d);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 350;
      const peak = ctx.createBiquadFilter(); peak.type = 'peaking'; peak.frequency.value = 2600; peak.Q.value = 1.2; peak.gain.value = 9;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
      const shaper = ctx.createWaveShaper();
      const curve = new Float32Array(1024);
      for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(3 * x); }
      shaper.curve = curve;
      shaper.connect(hp).connect(peak).connect(lp).connect(out).connect(ctx.destination);

      // 震え：振幅を速く揺らし、後半ほど荒くする
      const rough = ctx.createGain(); rough.gain.value = 0.6; rough.connect(shaper);
      const lfo = ctx.createOscillator(); lfo.frequency.setValueAtTime(58, t); lfo.frequency.linearRampToValueAtTime(31, t + d);
      const lfoAmp = ctx.createGain(); lfoAmp.gain.setValueAtTime(0.15, t); lfoAmp.gain.linearRampToValueAtTime(0.45, t + d);
      lfo.connect(lfoAmp).connect(rough.gain);
      // ビブラート：音程を小刻みに揺らす
      const vib = ctx.createOscillator(); vib.frequency.value = 11;
      const vibAmp = ctx.createGain(); vibAmp.gain.value = 45; vib.connect(vibAmp);

      const voice = (type, f0, f1, f2, gain, len) => {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
        g.gain.setValueAtTime(gain, t); g.gain.setValueAtTime(gain, t + len * 0.8); g.gain.linearRampToValueAtTime(0, t + len);
        o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.18);
        o.frequency.exponentialRampToValueAtTime(f2, t + d);
        vibAmp.connect(o.frequency);
        o.connect(g).connect(rough); o.start(t); o.stop(t + len); };
      voice('sawtooth', 700, 1650, 1250, 0.42, d);   // 主役の金切り声
      voice('sawtooth', 960, 2260, 1700, 0.26, d);   // 不協和な上の声
      voice('square',   350,  830,  620, 0.12, d);   // 喉鳴り
      voice('sawtooth',  90,  150,   70, 0.30, 0.5); // 出だしの低い息

      const n = ctx.createBufferSource(), buf = ctx.createBuffer(1, ctx.sampleRate * d, ctx.sampleRate);
      const ch = buf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      n.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = 0.8;
      const ng = ctx.createGain(); ng.gain.value = 0.3;
      n.connect(bp).connect(ng).connect(rough); n.start(t); n.stop(t + d);
      lfo.start(t); lfo.stop(t + d); vib.start(t); vib.stop(t + d);

      if (navigator.vibrate) navigator.vibrate([80, 40, 900]);
      $('roar').classList.add('playing'); setTimeout(() => $('roar').classList.remove('playing'), d * 1000);
    }
    $('roar').addEventListener('click', roar);
  </script>
</body>
</html>
